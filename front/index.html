<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Канбан-доска</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">ПРОЕКТ</p>
        <h1>Канбан-доска</h1>
      </div>
      <button class="button button-light" id="refresh">Обновить</button>
    </header>

    <form class="task-form" id="task-form">
      <h2>Новая задача</h2>
      <div class="form-fields">
        <input id="title" placeholder="Название задачи" required>
        <input id="description" placeholder="Описание (необязательно)">
        <button class="button" type="submit">Добавить</button>
      </div>
    </form>

    <p class="error" id="error" role="alert" hidden></p>
    <section class="board" id="board" aria-label="Задачи"></section>
  </main>
</body>
</html>
